<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OREGANO </title>
    <meta name="description" content="Order fresh shawarmas, burgers, broast and fries from Oregano.">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">
        <div class="logo-circle">O</div>
        <h1>Oregano</h1>
      </a>
        <div class="nav-icons">
          <button class="icon-btn" aria-label="Shopping cart">
    <i class="fa-solid fa-bag-shopping"></i>
</button>

<button class="icon-btn" aria-label="Settings">
<i class="fa-solid fa-gear"></i>
</button>
 </div>
    </header>

    <main>
          <section class="hero">

    <div class="hero-card">
    <button class="order-btn">Order Now</button>

        <h2>
            <span class="dark-text">Fresh, Fast &</span><br>
            <span class="light-text">Served Warm</span>
        </h2>

        <p>
            Enjoy delicious food made fresh every day.
            Order your favorite meals in just a few clicks.
        </p>
      </div>
      
          </section>
          <section class="categories">

    <div class="category-container">

        <button type="button" class="category active">All Menu</button>

        <button type="button" class="category">Rolls & Paratha</button>

        <button type="button" class="category">Shawarma</button>

        <button type="button" class="category">Fries</button>

        <button type="button" class="category">Broast</button>

        <button type="button" class="category">Burger</button>

    </div>

    <div class="scroll-line">
        <div class="scroll-fill"></div>
    </div>
 </section>
      
<section class="products">
<div class="product-card">

        <div class="product-image">
            <span class="price">Rs 550</span>
            <img src="https://pngimg.com/d/fried_chicken_PNG14168.png" alt="Chicken Broast">
        </div>

        <div class="product-info">
            <h5>BROAST</h5>
            <h2>Chicken Broast 2 Piece</h2>
            <p>Two pieces of crispy broasted chicken</p>
            <button class="order-button"><span>+</span> Add to Order </button>
        </div>

    </div>
            </section>
      
    </main>

    <script src="script.js"></script>
  </body>
</html>
