<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OREGANO </title>
    <meta name="description" content="Order fresh shawarmas, burgers, broast and fries from Oregano.">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">
        <div class="logo-circle">O
          </div>
        <h1>Oregano</h1>
      </a>
        <div class="nav-icons">
          <button class="icon-btn" aria-label="Shopping cart">
    <i class="fa-solid fa-bag-shopping"></i>

</button>

<button class="icon-btn settings" aria-label="Settings">

<i class="fa-solid fa-gear"></i>

</button>

        </div>
    </header>

    <main>
          <section class="hero">

    <div class="hero-card">
      <div class="hero-text">

        <button class="order-btn">Order Now</button>

        <h2>
            <span class="dark-text">Fresh, Fast &</span><br>
            <span class="light-text">Served Warm</span>
        </h2>

        <p>
            Enjoy delicious food made fresh every day.
            Order your favorite meals in just a few clicks.
        </p>
      </div>
        <div class="hero-image">
<img src="images/hero-burger.png" alt="burger">
    </div>
    </div>
          </section>
          <section class="categories">

    <div class="category-container">

        <button type="button" class="category active">All Menu</button>

        <button type="button" class="category">Rolls & Paratha</button>

        <button type="button" class="category">Shawarma</button>

        <button type="button" class="category">Fries</button>

        <button type="button" class="category">Broast</button>

        <button type="button" class="category">Burger</button>

    </div>

          </section>
          <div class="scroll-line">
        <div class="scroll-fill"></div>
    </div>

          </section>
          <section class="products">

    <div class="product-card">

        <div class="product-image">

            <span class="price">Rs 550</span>

            <img src="images/broast.png" alt="Chicken Broast">

        </div>

        <div class="product-info">

            <h5>BROAST</h5>

            <h2>Chicken Broast 2 Piece</h2>

            <p>Two pieces of crispy broasted chicken</p>

            <button class="order-button" aria-label="Add Chicken Broast 2 Piece to cart">
                <span>+</span> Add to Order
            </button>

        </div>

    </div>

            </section>
    </main>
    <footer class="bottom-nav">

    <a href="index.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="menu.html">
        <i class="fa-solid fa-utensils"></i>
        <span>Menu</span>
    </a>

    <a href="cart.html">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Cart</span>
    </a>

    <a href="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

    </footer>
    <script src="script.js"></script>
  </body>
</html>
