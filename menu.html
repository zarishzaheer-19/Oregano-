<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OREGANO </title>
    <meta name="description" content="Order fresh shawarmas, burgers, broast and fries from Oregano.">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">
        <div class="logo-circle">O</div>
        <h1>Oregano</h1>
      </a>
        <div class="nav-icons">
          <button class="icon-btn" aria-label="Shopping cart">
    <i class="fa-solid fa-bag-shopping"></i>
</button>

<button class="icon-btn" aria-label="Settings">
<i class="fa-solid fa-gear"></i>
</button>
        </div>
    </header>
    <main>

<section class="search-section">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search food...">
    </div>
</section>

<section class="categories">

    <div class="category-container">
        <button class="category active">All</button>
        <button class="category">Broast</button>
        <button class="category">Burger</button>
        <button class="category">Shawarma</button>
        <button class="category">Fries</button>
        <button class="category">Drinks</button>
    </div>

</section>

<section class="menu-grid">

    <div class="menu-card">
        <img src="images/broast.png" alt="Chicken Broast">
        <h3>Chicken Broast</h3>
        <p>2 Crispy Pieces</p>

        <div class="card-bottom">
            <span>Rs 550</span>
            <button><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <div class="menu-card">
        <img src="images/shawarma.png" alt="Chicken Shawarma">
        <h3>Chicken Shawarma</h3>
        <p>Garlic Sauce</p>

        <div class="card-bottom">
            <span>Rs 450</span>
            <button><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <div class="menu-card">
        <img src="images/burger.png" alt="Zinger Burger">
        <h3>Zinger Burger</h3>
        <p>Cheese & Mayo</p>

        <div class="card-bottom">
            <span>Rs 650</span>
            <button><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <div class="menu-card">
        <img src="images/fries.png" alt="Loaded Fries">
        <h3>Loaded Fries</h3>
        <p>Cheese Fries</p>

        <div class="card-bottom">
            <span>Rs 350</span>
            <button><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <div class="menu-card">
        <img src="images/roll.png" alt="Roll Paratha">
        <h3>Roll Paratha</h3>
        <p>Chicken Roll</p>

        <div class="card-bottom">
            <span>Rs 400</span>
            <button><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <div class="menu-card">
        <img src="images/drink.png" alt="Soft Drink">
        <h3>Soft Drink</h3>
        <p>500 ml Bottle</p>

        <div class="card-bottom">
            <span>Rs 120</span>
            <button><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

</section>

  </main>
        

    <script src="script.js"></script>
  </body>
  </html>
