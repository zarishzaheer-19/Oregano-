<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oregano | Cart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <div class="logo-circle">O</div>
        <h1>Oregano</h1>
    </a>

    <div class="nav-icons">

        <button class="icon-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

    </div>

</header>

<main>
  <section class="cart">

    <h2>Your Cart</h2>

    <div class="cart-item">

        <img src="images/broast.png" alt="Chicken Broast">

        <div class="cart-info">
            <h3>Chicken Broast</h3>
            <p>Rs 550</p>
        </div>

        <div class="quantity">

            <button>-</button>

            <span>1</span>

            <button>+</button>

        </div>

    </div>

  </section>
    <div class="order-summary">

    <h3>Order Summary</h3>

    <div class="summary-row">
        <span>Subtotal</span>
        <span>Rs 550</span>
    </div>

    <div class="summary-row">
        <span>Delivery Fee</span>
        <span>Rs 100</span>
    </div>

    <div class="summary-row total">
        <span>Total</span>
        <span>Rs 650</span>
    </div>

    <button class="checkout-btn">
        Proceed to Checkout
    </button>

    </div>
</main>
    <script src="script.js"></script>
</body>
</html>
